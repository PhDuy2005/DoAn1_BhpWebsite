name: doan1

services:
  management-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MANAGEMENT_DB_NAME:-da1}
      MYSQL_ROOT_PASSWORD: ${MANAGEMENT_DB_ROOT_PASSWORD:-123456}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${MANAGEMENT_DB_HOST_PORT:-3307}:3306"
    volumes:
      - management-db-data:/var/lib/mysql
      - ./db-dump/da1.sql:/docker-entrypoint-initdb.d/da1.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  exam-db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${EXAM_DB_NAME:-exam_service}
      MYSQL_ROOT_PASSWORD: ${EXAM_DB_ROOT_PASSWORD:-123456}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${EXAM_DB_HOST_PORT:-3308}:3306"
    volumes:
      - exam-db-data:/var/lib/mysql
      - ./db-dump/exam_service.sql:/docker-entrypoint-initdb.d/exam_service.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  management-service:
    build:
      context: .
      dockerfile: ManagementService/Dockerfile
    restart: unless-stopped
    depends_on:
      management-db:
        condition: service_healthy
    environment:
      SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      GRPC_SERVER_PORT: ${MANAGEMENT_GRPC_SERVER_PORT:-9092}
      MANAGEMENT_SERVER_PORT: ${MANAGEMENT_SERVER_PORT:-8081}
      MANAGEMENT_GRPC_SERVER_PORT: ${MANAGEMENT_GRPC_SERVER_PORT:-9092}
      MANAGEMENT_GRPC_SERVER_ENABLED: ${MANAGEMENT_GRPC_SERVER_ENABLED:-true}
      MANAGEMENT_DB_URL: "jdbc:mysql://management-db:3306/${MANAGEMENT_DB_NAME:-da1}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh"
      MANAGEMENT_DB_USERNAME: ${MANAGEMENT_DB_USERNAME:-root}
      MANAGEMENT_DB_PASSWORD: ${MANAGEMENT_DB_ROOT_PASSWORD:-123456}
      SPRING_DATASOURCE_URL: "jdbc:mysql://management-db:3306/${MANAGEMENT_DB_NAME:-da1}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh"
      SPRING_DATASOURCE_USERNAME: ${MANAGEMENT_DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${MANAGEMENT_DB_ROOT_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-noVGO4KXfRQijWLkkHTdwMZzJcsvohOLNTzXHkWOEOwwj50/QWunAGce8b6XKqUwss6ozCb5A/e++2SPZN/d2Q==}
      MANAGEMENT_JPA_DDL_AUTO: ${MANAGEMENT_JPA_DDL_AUTO:-update}
      MANAGEMENT_JPA_SHOW_SQL: ${MANAGEMENT_JPA_SHOW_SQL:-true}
      MANAGEMENT_JPA_DEFER_DATASOURCE_INITIALIZATION: ${MANAGEMENT_JPA_DEFER_DATASOURCE_INITIALIZATION:-true}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${MANAGEMENT_JPA_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${MANAGEMENT_JPA_SHOW_SQL:-true}
      SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: ${MANAGEMENT_JPA_DEFER_DATASOURCE_INITIALIZATION:-true}
      MANAGEMENT_JWT_ACCESS_TOKEN_VALIDITY_SECONDS: ${MANAGEMENT_JWT_ACCESS_TOKEN_VALIDITY_SECONDS:-864000}
      MANAGEMENT_JWT_REFRESH_TOKEN_VALIDITY_SECONDS: ${MANAGEMENT_JWT_REFRESH_TOKEN_VALIDITY_SECONDS:-864000}
      MANAGEMENT_MULTIPART_MAX_FILE_SIZE: ${MANAGEMENT_MULTIPART_MAX_FILE_SIZE:-50MB}
      MANAGEMENT_MULTIPART_MAX_REQUEST_SIZE: ${MANAGEMENT_MULTIPART_MAX_REQUEST_SIZE:-50MB}
      MANAGEMENT_ACTUATOR_EXPOSURE: ${MANAGEMENT_ACTUATOR_EXPOSURE:-health,info,metrics,env,beans,mappings}
      MANAGEMENT_LOG_LEVEL: ${MANAGEMENT_LOG_LEVEL:-DEBUG}
      MANAGEMENT_INIT_EMPLOYEE_RA_ENABLED: ${MANAGEMENT_INIT_EMPLOYEE_RA_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: "${MAIL_PORT:-587}"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM: "${MAIL_FROM:-${MAIL_USERNAME:-}}"
      MAIL_SMTP_AUTH: "${MAIL_SMTP_AUTH:-true}"
      MAIL_SMTP_STARTTLS_ENABLE: "${MAIL_SMTP_STARTTLS_ENABLE:-true}"
      MAIL_SMTP_STARTTLS_REQUIRED: "${MAIL_SMTP_STARTTLS_REQUIRED:-true}"
      MAIL_SMTP_CONNECTION_TIMEOUT: "${MAIL_SMTP_CONNECTION_TIMEOUT:-10000}"
      MAIL_SMTP_TIMEOUT: "${MAIL_SMTP_TIMEOUT:-10000}"
      MAIL_SMTP_WRITE_TIMEOUT: "${MAIL_SMTP_WRITE_TIMEOUT:-10000}"
    ports:
      - "${MANAGEMENT_SERVICE_HOST_PORT:-8081}:${MANAGEMENT_SERVER_PORT:-8081}"
      - "${MANAGEMENT_GRPC_HOST_PORT:-9092}:${MANAGEMENT_GRPC_SERVER_PORT:-9092}"

  scoring-service:
    build:
      context: .
      dockerfile: ScoringService/Dockerfile
    restart: unless-stopped
    environment:
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: ${SCORINGSERVICE_GRPC_PORT:-50051}
      EXAMSERVICE_STORAGE_ROOT_PATH: /data/exam-service
    volumes:
      - exam-storage:/data/exam-service
    ports:
      - "${SCORING_SERVICE_HOST_PORT:-50051}:${SCORINGSERVICE_GRPC_PORT:-50051}"

  exam-service:
    build:
      context: .
      dockerfile: ExamService/ExamService/Dockerfile
    restart: unless-stopped
    depends_on:
      exam-db:
        condition: service_healthy
      management-service:
        condition: service_started
      scoring-service:
        condition: service_started
    environment:
      EXAMSERVICE_SERVER_PORT: ${EXAMSERVICE_SERVER_PORT:-8080}
      EXAMSERVICE_DB_URL: "jdbc:mysql://exam-db:3306/${EXAM_DB_NAME:-exam_service}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh"
      EXAMSERVICE_DB_USERNAME: ${EXAM_DB_USERNAME:-root}
      EXAMSERVICE_DB_PASSWORD: ${EXAM_DB_ROOT_PASSWORD:-123456}
      EXAMSERVICE_JWT_BASE64_SECRET: ${JWT_SECRET:-noVGO4KXfRQijWLkkHTdwMZzJcsvohOLNTzXHkWOEOwwj50/QWunAGce8b6XKqUwss6ozCb5A/e++2SPZN/d2Q==}
      EXAMSERVICE_MULTIPART_MAX_FILE_SIZE: ${EXAMSERVICE_MULTIPART_MAX_FILE_SIZE:-50MB}
      EXAMSERVICE_MULTIPART_MAX_REQUEST_SIZE: ${EXAMSERVICE_MULTIPART_MAX_REQUEST_SIZE:-50MB}
      EXAMSERVICE_STORAGE_ROOT_PATH: /data/exam-service
      EXAMSERVICE_EXAM_PAPER_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      EXAMSERVICE_SCORING_SERVICE_HOST: scoring-service
      EXAMSERVICE_SCORING_SERVICE_PORT: ${SCORINGSERVICE_GRPC_PORT:-50051}
      EXAMSERVICE_SCORING_SERVICE_TIMEOUT_SECONDS: ${EXAMSERVICE_SCORING_SERVICE_TIMEOUT_SECONDS:-90}
      EXAMSERVICE_MANAGEMENT_SERVICE_HOST: management-service
      EXAMSERVICE_MANAGEMENT_SERVICE_PORT: ${MANAGEMENT_GRPC_SERVER_PORT:-9092}
      EXAMSERVICE_MANAGEMENT_SERVICE_TIMEOUT_SECONDS: ${EXAMSERVICE_MANAGEMENT_SERVICE_TIMEOUT_SECONDS:-20}
    volumes:
      - exam-storage:/data/exam-service
    ports:
      - "${EXAM_SERVICE_HOST_PORT:-8080}:${EXAMSERVICE_SERVER_PORT:-8080}"

  api-gateway:
    build:
      context: .
      dockerfile: APIGateway/ApiGateway/Dockerfile
    restart: unless-stopped
    depends_on:
      management-service:
        condition: service_started
      exam-service:
        condition: service_started
    environment:
      API_GATEWAY_SERVER_PORT: ${API_GATEWAY_SERVER_PORT:-8084}
      API_GATEWAY_MULTIPART_MAX_FILE_SIZE: ${API_GATEWAY_MULTIPART_MAX_FILE_SIZE:-100MB}
      API_GATEWAY_MULTIPART_MAX_REQUEST_SIZE: ${API_GATEWAY_MULTIPART_MAX_REQUEST_SIZE:-110MB}
      API_GATEWAY_ACTUATOR_EXPOSURE: ${API_GATEWAY_ACTUATOR_EXPOSURE:-health,info,gateway}
      MANAGEMENT_SERVICE_URI: http://management-service:${MANAGEMENT_SERVER_PORT:-8081}
      EXAM_SERVICE_URI: http://exam-service:${EXAMSERVICE_SERVER_PORT:-8080}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_GATEWAY_HOST_PORT:-8084}:${API_GATEWAY_SERVER_PORT:-8084}"

  frontend:
    build:
      context: ./Project_1
      dockerfile: dockerfile
      args:
        VITE_APP_API_URL_MS: ${VITE_APP_API_URL_MS:-http://localhost:8084}
        VITE_APP_API_URL_ES: ${VITE_APP_API_URL_ES:-http://localhost:8084}
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_started
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"

volumes:
  management-db-data:
  exam-db-data:
  exam-storage:
