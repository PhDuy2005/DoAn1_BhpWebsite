name: Common CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: common-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  java-services:
    name: Java - ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: da1
          MYSQL_ROOT_PASSWORD: "123456"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: API Gateway
            slug: api-gateway
            path: APIGateway/ApiGateway
            task: clean build
          - service: Management Service
            slug: management-service
            path: ManagementService
            task: clean build
          - service: Exam Service
            slug: exam-service
            path: ExamService/ExamService
            task: clean build

    env:
      CI: "true"
      MANAGEMENT_DB_URL: jdbc:mysql://127.0.0.1:3306/da1?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      MANAGEMENT_DB_USERNAME: root
      MANAGEMENT_DB_PASSWORD: "123456"
      MANAGEMENT_JPA_DDL_AUTO: update
      MANAGEMENT_JPA_SHOW_SQL: "false"
      MANAGEMENT_GRPC_SERVER_ENABLED: "false"
      MANAGEMENT_INIT_EMPLOYEE_RA_ENABLED: "false"
      EXAMSERVICE_STORAGE_ROOT_PATH: /tmp/exam-service-storage
      EXAMSERVICE_EXAM_PAPER_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure private submodule token
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
        run: |
          if [ -n "$CI_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${CI_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Checkout service submodule
        run: |
          git submodule sync -- "${{ matrix.path }}"
          git submodule update --init --depth 1 -- "${{ matrix.path }}"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
          cache-dependency-path: |
            ${{ matrix.path }}/**/*.gradle*
            ${{ matrix.path }}/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        working-directory: ${{ matrix.path }}
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build and test
        working-directory: ${{ matrix.path }}
        run: ./gradlew ${{ matrix.task }} --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-report-${{ matrix.slug }}
          path: ${{ matrix.path }}/build/reports/tests/test
          if-no-files-found: ignore

  scoring-service:
    name: Scoring Service
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      SCORINGSERVICE_STORAGE_ROOT_PATH: /tmp/scoring-service-storage
      SCORINGSERVICE_GRPC_HOST: 127.0.0.1
      SCORINGSERVICE_GRPC_PORT: "50051"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure private submodule token
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
        run: |
          if [ -n "$CI_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${CI_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Checkout ScoringService submodule
        run: |
          git submodule sync -- ScoringService
          git submodule update --init --depth 1 -- ScoringService

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ScoringService/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install Python dependencies
        working-directory: ScoringService
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify shared proto
        run: test -f proto/scoring/v1/scoring_normal.proto

      - name: Compile Python source
        working-directory: ScoringService
        run: python -m compileall app generated run.py run_grpc.py

      - name: Smoke import application
        working-directory: ScoringService
        run: |
          python - <<'PY'
          from app.grpc.server import create_server
          from app.main import app
          from app.services.answer_detection import load_templates

          assert app.title == "Scoring Service"
          templates = load_templates()
          expected_templates = {"candidate_id", "exam_id", "part_1", "part_2", "part_3"}
          assert expected_templates <= set(templates)

          server = create_server()
          server.stop(0)
          print("Smoke checks passed")
          PY

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: Project_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure private submodule token
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
        run: |
          if [ -n "$CI_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${CI_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Checkout frontend submodule
        run: |
          git submodule sync -- Project_1
          git submodule update --init --depth 1 -- Project_1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Project_1/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    name: Docker - ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - java-services
      - scoring-service
      - frontend

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: management-service
            context: .
            dockerfile: ManagementService/Dockerfile
            submodule: ManagementService
          - image: exam-service
            context: .
            dockerfile: ExamService/ExamService/Dockerfile
            submodule: ExamService/ExamService
          - image: scoring-service
            context: .
            dockerfile: ScoringService/Dockerfile
            submodule: ScoringService
          - image: api-gateway
            context: .
            dockerfile: APIGateway/ApiGateway/Dockerfile
            submodule: APIGateway/ApiGateway
          - image: frontend
            context: Project_1
            dockerfile: Project_1/dockerfile
            submodule: Project_1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configure private submodule token
        env:
          CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
        run: |
          if [ -n "$CI_REPO_TOKEN" ]; then
            git config --global url."https://x-access-token:${CI_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Checkout image submodule
        run: |
          git submodule sync -- "${{ matrix.submodule }}"
          git submodule update --init --depth 1 -- "${{ matrix.submodule }}"

      - name: Build Docker image
        run: docker build -f ${{ matrix.dockerfile }} -t doan1-${{ matrix.image }}:${{ github.sha }} ${{ matrix.context }}
