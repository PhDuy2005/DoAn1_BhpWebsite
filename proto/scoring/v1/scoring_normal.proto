syntax = "proto3";

package scoring.normal.v1;

service ScoringNormalService {
  rpc ReadOmr(ReadOmrRequest) returns (stream ReadOmrResponse);
}

message ReadOmrRequest {
  string request_id = 1;
  string exam_uuid = 2;
  string pdf_url = 3;
  string scanned_at = 4;
}

message SectionAnswer {
  int32 section_question_number = 1;
  string raw_answer = 2;
}

message OmrSections {
  repeated SectionAnswer mcq = 1;
  repeated SectionAnswer tfq = 2;
  repeated SectionAnswer saq = 3;
}

message ReadOmrPayload {
  string exam_uuid = 1;
  string paper_code = 2;
  string student_code = 3;
  string external_submission_id = 4;
  string scanned_at = 5;
  OmrSections sections = 6;
  string raw_image_url = 7;
  string scored_image_url = 8;
}

message ReadOmrResponse {
  string request_id = 1;
  int32 page_number = 2;
  int32 total_pages = 3;
  bool success = 4;
  string error_message = 5;
  ReadOmrPayload data = 6;
}
